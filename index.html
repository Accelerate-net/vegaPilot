<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Pilot - Login</title>

    <link href='http://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400italic,600' rel='stylesheet' type='text/css'>
    <link type="text/css" href="assets/plugins/iCheck/skins/minimal/blue.css" rel="stylesheet">
    <link type="text/css" href="assets/fonts/font-awesome/css/font-awesome.min.css" rel="stylesheet">
    <link type="text/css" href="assets/fonts/themify-icons/themify-icons.css" rel="stylesheet">               <!-- Themify Icons -->
    <link type="text/css" href="assets/css/styles.css" rel="stylesheet">

    <link rel="shortcut icon" href="assets/icons/favicon.png">

    <style>
        /* Smooth Animations for Login Page */

        /* Logo Animation */
        .login-logo {
            animation: fadeInDown 0.8s ease-out;
            display: inline-block;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Panel Animation */
        .panel {
            animation: slideUpFadeIn 1s ease-out 0.3s backwards;
        }

        @keyframes slideUpFadeIn {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Form Group Stagger Animation */
        .form-group:nth-child(1) {
            animation: fadeInRight 0.6s ease-out 0.6s backwards;
        }

        .form-group:nth-child(2) {
            animation: fadeInRight 0.6s ease-out 0.8s backwards;
        }

        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Input Focus Animation */
        .form-control {
            transition: all 0.3s ease;
        }

        .form-control:focus {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .input-group-addon {
            transition: all 0.3s ease;
        }

        .input-group:focus-within .input-group-addon {
            background-color: #5db2ff;
            color: white;
            transform: scale(1.05);
        }

        /* Button Animation */
        .btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(93, 178, 255, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        /* Panel Footer Animation */
        .panel-footer {
            animation: fadeIn 0.6s ease-out 1s backwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Error Message Animation */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        p[ng-if="isLoginError"] {
            animation: shake 0.5s ease-in-out, fadeIn 0.3s ease-out;
        }

        /* Container Animation */
        #login-form {
            animation: fadeIn 0.5s ease-out;
        }

        /* Smooth Page Load */
        body.focused-form {
            animation: fadeIn 0.4s ease-out;
        }

        /* Input Placeholder Animation */
        .form-control::placeholder {
            transition: all 0.3s ease;
        }

        .form-control:focus::placeholder {
            transform: translateX(5px);
            opacity: 0.6;
        }
    </style>

    <!-- Controller -->
      <script src="assets/js/jquery.js"></script>
      <script src="assets/js/angular.min.js"></script>
      <script src="assets/js/angular-cookies.min.js"></script>
      <script src="controllers/login.js"></script>

    </head>

    <body class="focused-form animated-content" ng-app="AdminLoginApp" ng-controller="adminloginController" ng-cloak>


<div class="container" id="login-form">

		<div class="row">
			<div class="col-md-6 col-md-offset-3">
        <a href="" class="login-logo"><img src="assets/img/designer_logo.png" width="65%"></a>
				<div class="panel panel-default">

					<div class="panel-heading">
						<h2>Login</h2>
					</div>
					<div class="panel-body">

						<form action="" class="form-horizontal" id="validate-form">
							<div class="form-group mb-md">
		                        <div class="col-xs-12">
		                        	<div class="input-group">
										<span class="input-group-addon">
											<i class="ti ti-user"></i>
										</span>
										<input type="text" class="form-control" placeholder="Username" ng-model="username" required>
									</div>
		                        </div>
							</div>

							<div class="form-group mb-md">
		                        <div class="col-xs-12">
		                        	<div class="input-group">
										<span class="input-group-addon">
											<i class="ti ti-key"></i>
										</span>
										<input type="password" class="form-control" ng-model="password" placeholder="Password">
									</div>
		                        </div>
							</div>

						</form>
					</div>
					<div class="panel-footer">
            			<p ng-if="isLoginError" style="float: left; color: red;">{{warnMsg}}</p>
						<div class="clearfix">
							<a ng-click="loginadmin()" class="btn btn-primary pull-right">Login</a>
						</div>
					</div>
				</div>

			</div>
		</div>
</div>

<script type="text/javascript" src="assets/js/jquery-1.10.2.min.js"></script> 							<!-- Load jQuery -->
<script type="text/javascript" src="assets/js/jqueryui-1.10.3.min.js"></script> 							<!-- Load jQueryUI -->
<script type="text/javascript" src="assets/js/bootstrap.min.js"></script> 								<!-- Load Bootstrap -->
<script type="text/javascript" src="assets/js/enquire.min.js"></script> 									<!-- Load Enquire -->

<script type="text/javascript" src="assets/plugins/velocityjs/velocity.min.js"></script>					<!-- Load Velocity for Animated Content -->
<script type="text/javascript" src="assets/plugins/velocityjs/velocity.ui.min.js"></script>

<script type="text/javascript" src="assets/plugins/wijets/wijets.js"></script>     						<!-- Wijet -->

<script type="text/javascript" src="assets/plugins/codeprettifier/prettify.js"></script> 				<!-- Code Prettifier  -->
<script type="text/javascript" src="assets/plugins/bootstrap-switch/bootstrap-switch.js"></script> 		<!-- Swith/Toggle Button -->

<script type="text/javascript" src="assets/plugins/bootstrap-tabdrop/js/bootstrap-tabdrop.js"></script>  <!-- Bootstrap Tabdrop -->

<script type="text/javascript" src="assets/plugins/iCheck/icheck.min.js"></script>     					<!-- iCheck -->

<script type="text/javascript" src="assets/plugins/nanoScroller/js/jquery.nanoscroller.min.js"></script> <!-- nano scroller -->

<script type="text/javascript" src="assets/js/application.js"></script>
<script type="text/javascript" src="assets/demo/demo.js"></script>

    </body>
</html>
