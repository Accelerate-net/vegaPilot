<style>html,body{margin:0;padding:0;background:transparent;}</style>
<div style="
    position:relative;
    width:3.375in;
    height:2.125in;
    overflow:hidden;
"><div style="
    position:relative;
    width:1011px;
    height:638px;
    overflow:hidden;
    transform:scale(0.320475, 0.319749);
    transform-origin:top left;
    font-family:Arial,Helvetica,sans-serif;
    background:url('background.svg') no-repeat center center;
    background-size:cover;
">

    <!-- LOGO (above photo) -->
    <div style="
        position:absolute;
        left:215px;
        transform:translateX(-50%);
        top:70px;
        z-index:3;
    ">
        <img
            src="logo.svg"
            style="
                height:80px;
                display:block;
            "
        />
    </div>

    <!-- ID CARD TITLE (above name) -->
    <div style="
        position:absolute;
        left:430px;
        top:170px;
        width:500px;
        text-align:left;
        font-family:Arial,Helvetica,sans-serif;
        font-size:34px;
        font-weight:800;
        letter-spacing:1px;
        line-height:1;
        color:#f4b400;
        text-transform:uppercase;
        white-space:nowrap;
        z-index:3;
    ">
        STUDENT ID CARD
    </div>

    <!-- PHOTO -->
    <div style="
        position:absolute;
        left:70px;
        top:163px;
        width:292px;
        height:332px;
        border:10px solid #f4b400;
        border-radius:42px;
        overflow:hidden;
        background:#ffffff;
        z-index:3;
    ">
        <div style="
            position:relative;
            width:100%;
            height:100%;
        ">
            <!-- FALLBACK PLACEHOLDER (shown when no photo provided) -->
            <div style="
                position:absolute;
                inset:0;
                display:flex;
                align-items:center;
                justify-content:center;
                background:repeating-linear-gradient(
                    45deg,
                    #f3f4f6,
                    #f3f4f6 16px,
                    #e5e7eb 16px,
                    #e5e7eb 32px
                );
                color:#6b7280;
                font-size:28px;
                font-weight:700;
                text-align:center;
                letter-spacing:1px;
            ">
                STUDENT<br>PHOTO
            </div>

            <!-- USER-SELECTED PHOTO (overlays the placeholder when {{STUDENT_PHOTO}} resolves) -->
            <img
                src="{{STUDENT_PHOTO}}"
                onerror="this.remove()"
                style="
                    position:absolute;
                    inset:0;
                    width:100%;
                    height:100%;
                    object-fit:cover;
                    display:block;
                "
            />
        </div>
    </div>

    <!-- STUDENT ID (below photo) -->
    <div style="
        position:absolute;
        left:70px;
        top:525px;
        width:312px;
        text-align:center;
        font-size:30px;
        font-weight:800;
        color:#005f73;
        letter-spacing:1px;
        z-index:3;
    ">
        {{STUDENT_ID}}
    </div>

    <!-- NAME -->
    <div style="
        position:absolute;
        left:430px;
        top:230px;
        width:500px;
        z-index:3;
        color:#005f73;
        text-transform:uppercase;
        line-height:0.93;
    ">
        <div
            data-autofit-name
            style="
                font-size:48px;
                font-weight:800;
                letter-spacing:-1px;
                overflow-wrap:break-word;
                word-break:break-word;
            "
        >
            {{STUDENT_NAME}}
        </div>
    </div>
    <script>
        (function () {
            function fit(el) {
                var max = 48, min = 22;
                var lh = 0.93;
                el.style.fontSize = max + 'px';
                // Shrink until the rendered height is at most 2 lines.
                for (var size = max; size >= min; size -= 1) {
                    el.style.fontSize = size + 'px';
                    if (el.scrollHeight <= Math.ceil(size * lh * 2) + 1) return;
                }
            }
            function run() {
                document.querySelectorAll('[data-autofit-name]').forEach(fit);
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', run);
            } else {
                run();
            }
        })();
    </script>

    <!-- DETAILS -->
    <div style="
        position:absolute;
        left:430px;
        top:338px;
        width:510px;
        z-index:3;
    ">

        <!-- DOB -->
        <div style="
            display:flex;
            margin-bottom:24px;
            align-items:flex-start;
        ">
            <div style="
                width:170px;
                font-size:22px;
                font-weight:800;
                color:#000;
            ">
                D.O.B
            </div>

            <div style="
                width:30px;
                font-size:22px;
                font-weight:700;
                color:#000;
            ">:</div>

            <div style="
                flex:1;
                font-size:22px;
                color:#222;
            ">
                {{DOB}}
            </div>
        </div>

        <!-- ADDRESS -->
        <div style="
            display:flex;
            margin-bottom:24px;
            align-items:flex-start;
        ">
            <div style="
                width:170px;
                font-size:22px;
                font-weight:800;
                color:#000;
            ">
                ADDRESS
            </div>

            <div style="
                width:30px;
                font-size:22px;
                font-weight:700;
                color:#000;
            ">:</div>

            <div style="
                flex:1;
                font-size:22px;
                line-height:1.2;
                color:#222;
            ">
                {{COMMUNICATION_ADDRESS}}
            </div>
        </div>

        <!-- GUARDIAN -->
        <div style="
            display:flex;
            align-items:flex-start;
        ">
            <div style="
                width:170px;
                font-size:22px;
                font-weight:800;
                color:#000;
            ">
                GUARDIAN
            </div>

            <div style="
                width:30px;
                font-size:22px;
                font-weight:700;
                color:#000;
            ">:</div>

            <div style="
                flex:1;
                font-size:22px;
                color:#222;
            ">
                {{GUARDIAN_PHONE}}
            </div>
        </div>

    </div>

</div></div>
